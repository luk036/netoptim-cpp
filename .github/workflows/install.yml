name: Install

on:
  push:
    branches: [master, main, dev]
  pull_request:
    branches: [master, main, dev]

permissions:
  contents: read

env:
  CTEST_OUTPUT_ON_FAILURE: 1

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Build and install library
        run: |
          cmake -B build -DCMAKE_BUILD_TYPE=Release \
            -DNETOPTIM_BUILD_TESTS=OFF -DNETOPTIM_BUILD_STANDALONE=OFF \
            -DNETOPTIM_BUILD_BENCHMARKS=OFF
          cmake --build build -j4
          sudo cmake --install build
          rm -rf build

      - name: Install system dependencies for consumer
        run: |
          sudo apt-get update
          sudo apt-get install -y libfmt-dev libabsl-dev

      - name: Configure consumer
        run: cmake -Stest_installed -B build_installed -DCMAKE_BUILD_TYPE=Release

      - name: Build consumer
        run: cmake --build build_installed -j4

      - name: Test
        run: ctest --test-dir build_installed --output-on-failure
